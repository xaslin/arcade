<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title>
<style>
html,body{margin:0;height:100%;background:#0b0d12;color:#eee;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{background:#11151d;border:2px solid #263042;max-width:92vmin;max-height:80vmin;width:92vmin;height:auto;aspect-ratio:1}
#s{margin-bottom:10px;font-weight:700}
small{color:#778;margin-top:8px}
</style></head><body>
<div id="s">Score: 0</div>
<canvas id="c" width="400" height="400"></canvas>
<small>Arrow keys / WASD to move &middot; Space to restart</small>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=20,S=c.width/N;
let snake,dir,next,food,score,dead,timer;
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=next={x:1,y:0};score=0;dead=false;place();clearInterval(timer);timer=setInterval(tick,110);}
function place(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(p=>p.x==food.x&&p.y==food.y))}
function tick(){
  dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x==h.x&&p.y==h.y)){dead=true;clearInterval(timer);draw();return}
  snake.unshift(h);
  if(h.x==food.x&&h.y==food.y){score++;place()}else snake.pop();
  draw();
}
function draw(){
  x.fillStyle='#11151d';x.fillRect(0,0,c.width,c.height);
  x.fillStyle='#ff5a5f';x.fillRect(food.x*S+2,food.y*S+2,S-4,S-4);
  snake.forEach((p,i)=>{x.fillStyle=i?'#4ade80':'#86efac';x.fillRect(p.x*S+1,p.y*S+1,S-2,S-2)});
  document.getElementById('s').textContent='Score: '+score+(dead?'  — Game over':'');
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
  if(m&&!(m[0]==-dir.x&&m[1]==-dir.y)){next={x:m[0],y:m[1]};e.preventDefault()}
  if(k==' '){reset();e.preventDefault()}
});
reset();
</script></body></html>
